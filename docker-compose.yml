# PostgreSQL para desarrollo. Defina DB_PASSWORD en el entorno o archivo .env local.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tuotu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD antes de iniciar PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos_tuotu:/var/lib/postgresql/data
volumes:
  datos_tuotu:
