# Base de datos PostgreSQL para el sistema (opcional; con el perfil "dev" no hace falta)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tuotu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - datos_tuotu:/var/lib/postgresql/data
volumes:
  datos_tuotu:
