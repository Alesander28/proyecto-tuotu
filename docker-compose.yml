# PostgreSQL y backend para desarrollo con Docker.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tuotu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos_tuotu:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tuotu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: tuotu-backend:1.0.0
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tuotu
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      ADMIN_USUARIO: ${ADMIN_USUARIO:?Defina ADMIN_USUARIO en .env}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:?Defina ADMIN_CONTRASENA en .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos_tuotu:
