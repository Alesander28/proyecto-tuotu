spring.application.name=sistema-tuotu
server.port=8080

# Base de datos PostgreSQL (se puede cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tuotu}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Orígenes permitidos para el frontend (separados por coma).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Cuenta inicial del gerente. ADMIN_CONTRASENA debe configurarse externamente y tener 12-72 caracteres.
# Ventas: métodos de pago aceptados y serie de la boleta de consumo (control interno)
app.metodos-pago=Efectivo,Yape,Plin,Tarjeta
app.comprobante.serie=B001

app.admin.usuario=${ADMIN_USUARIO:gerente}
app.admin.contrasena=${ADMIN_CONTRASENA:}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Monitorización de la aplicación
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never