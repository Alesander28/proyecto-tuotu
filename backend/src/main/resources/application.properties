spring.application.name=sistema-tuotu
server.port=8080

# Base de datos PostgreSQL (se puede cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tuotu}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cuenta inicial del gerente (cambiar la contraseña después del primer ingreso)
# Cargos adicionales de la carta (promedio; en el Sprint 3 se afinan por categoría)
app.recargo.extra-queso=3.00
app.recargo.para-llevar=2.00

# Ventas: métodos de pago aceptados y serie de la boleta de consumo (control interno)
app.metodos-pago=Efectivo,Yape,Plin,Tarjeta
app.comprobante.serie=B001

app.admin.usuario=${ADMIN_USUARIO:gerente}
app.admin.contrasena=${ADMIN_CONTRASENA:Gerente123*}
