# Perfil de producción: todos los secretos y direcciones se inyectan desde el entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# No modificar automáticamente el esquema en producción.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Debe ser el origen HTTPS exacto del frontend, sin comodines.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# El proxy/servidor frontal debe terminar TLS y reenviar correctamente estos encabezados.
server.forward-headers-strategy=framework
